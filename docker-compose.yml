services:
  autocoin-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autocoin-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    environment:
      TZ: Asia/Seoul
      NODE_ENV: production
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8001
      DB_MODE: ${DB_MODE:-sqlite}
      PG_SYNC_ENABLED: ${PG_SYNC_ENABLED:-false}
      AUTOCOIN_MASTER_KEY: ${AUTOCOIN_MASTER_KEY:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      USE_LOCAL_OLLAMA_NEWS: ${USE_LOCAL_OLLAMA_NEWS:-true}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_NEWS_MODEL: ${OLLAMA_NEWS_MODEL:-qwen3-news}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-14}
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/api/version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  llm-filter-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autocoin-llm-worker
    profiles: ["workers"]
    restart: unless-stopped
    command: ["/app/.venv/bin/python", "/app/llm_filter_worker.py"]
    environment:
      TZ: Asia/Seoul
      DB_MODE: ${DB_MODE:-sqlite}
      AUTOCOIN_MASTER_KEY: ${AUTOCOIN_MASTER_KEY:-}
      USE_LOCAL_OLLAMA_NEWS: ${USE_LOCAL_OLLAMA_NEWS:-true}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_NEWS_MODEL: ${OLLAMA_NEWS_MODEL:-qwen3-news}
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
    depends_on:
      autocoin-backend:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: autocoin-postgres
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      POSTGRES_DB: ${PGDATABASE:-coin_trader}
      POSTGRES_USER: ${PGUSER:-coin_trader}
      POSTGRES_PASSWORD: ${PGPASSWORD:-change_me_in_env}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - autocoin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-coin_trader} -d ${PGDATABASE:-coin_trader}"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  autocoin_pgdata:
